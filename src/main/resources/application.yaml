spring:
  application:
    name: transaction-processing-api

  datasource:
    url: jdbc:postgresql://localhost:5433/transaction_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info